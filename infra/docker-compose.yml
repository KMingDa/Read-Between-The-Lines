services:
  db:
    image: postgres:17
    container_name: read-between-lines-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: read_between_lines
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d read_between_lines"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
